name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Parser regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Run parser tests
        run: bash plugins/specclaw/tests/run-parser-tests.sh
      - name: Run memory-aware-parallelism tests
        run: bash plugins/specclaw/tests/run-memory-parallelism-tests.sh
      - name: Run long-running-orchestration tests
        run: bash plugins/specclaw/tests/run-long-orchestration-tests.sh
      - name: Run synthesized-agent tests
        run: bash plugins/specclaw/tests/run-synth-agent-tests.sh
      - name: Run shellcheck-gate tests
        run: bash plugins/specclaw/tests/run-shellcheck-gate-tests.sh
      - name: Run replay-classification tests
        run: bash plugins/specclaw/tests/run-replay-classification-tests.sh
      - name: Run stub-registry tests
        run: bash plugins/specclaw/tests/run-stub-registry-tests.sh
      - name: Run bootstrap-gate tests
        run: bash plugins/specclaw/tests/run-bootstrap-gate-tests.sh
      - name: Run item-split tests
        run: bash plugins/specclaw/tests/run-item-split-tests.sh
      - name: Run bootstrap-gate tests
        run: bash plugins/specclaw/tests/run-bootstrap-gate-tests.sh
      - name: Run item-split tests
        run: bash plugins/specclaw/tests/run-item-split-tests.sh
      - name: Run blueprint + options-pack tests
        run: bash plugins/specclaw/tests/run-blueprint-tests.sh
      - name: Run C#/Pascal validation-body parser tests
        run: bash plugins/specclaw/tests/run-cs-body-parser-tests.sh
      - name: Run bf-status dashboard tests
        run: bash plugins/specclaw/tests/run-bf-status-tests.sh
      - name: Run code-quality collector tests
        run: bash plugins/specclaw/tests/run-quality-tests.sh

  shellcheck:
    name: ShellCheck bin scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      # Fails on findings absent from tests/shellcheck-baseline.txt. The old
      # `|| true` form reported success no matter what shellcheck said, so a
      # green check was not evidence of a clean lint.
      - name: Lint bin/ scripts (no new findings)
        run: bash plugins/specclaw/tests/shellcheck-gate.sh

  json:
    name: Validate plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JSON + version sync
        run: |
          python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))"
          python3 -c "import json; json.load(open('plugins/specclaw/.claude-plugin/plugin.json'))"
          PV=$(python3 -c "import json; print(json.load(open('plugins/specclaw/.claude-plugin/plugin.json'))['version'])")
          MV=$(python3 -c "import json; print(json.load(open('.claude-plugin/marketplace.json'))['plugins'][0]['version'])")
          echo "plugin.json=$PV marketplace.json=$MV"
          test "$PV" = "$MV" || { echo "::error::version mismatch between plugin.json ($PV) and marketplace.json ($MV)"; exit 1; }
